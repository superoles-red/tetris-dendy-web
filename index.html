<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <title>Tetris · Tengen</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="assets/block.png" type="image/png">
  <link rel="preload" as="font" href="assets/tengen.ttf" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="controls.css">
  <link rel="stylesheet" href="install.css">
</head>
<body>
  <main id="machine" aria-label="Tengen Tetris">
    <section id="game" aria-label="Game" hidden>
      <div id="screen"><canvas id="picture" aria-label="Tetris playfield and statistics"></canvas></div>
      <button class="action primary" id="game-over-next" hidden>RECORDS</button>
      <div id="result-bar" hidden>
        <button id="after-game" class="action primary" hidden>PLAY AGAIN</button>
      </div>
      <div class="pad" aria-label="Game controls">
        <div class="moves">
          <button class="key direction left" data-button="left" aria-label="Move left" title="Влево · ←"><img src="assets/arrow.png" alt=""></button>
          <button class="key direction down" data-button="down" aria-label="Soft drop" title="Ускорить падение · ↓"><img src="assets/arrow.png" alt=""></button>
          <button class="key direction right" data-button="right" aria-label="Move right" title="Вправо · →"><img src="assets/arrow.png" alt=""></button>
        </div>
        <button id="pause-key" class="key utility" aria-label="Pause" title="Пауза · Esc"></button>
        <div class="turns">
          <button class="key turn" data-button="b" aria-label="Rotate counterclockwise" title="Против часовой · Z">B</button>
          <button class="key turn" data-button="a" aria-label="Rotate clockwise" title="По часовой · X или ↑">A</button>
        </div>
      </div>
    </section>
    <section id="overlay" aria-label="Game menu" data-menu="home">
      <button id="home-support" disabled>SUPPORT</button>
      <div id="panel" class="panel cover">
        <picture id="art">
          <source media="(prefers-reduced-motion: no-preference)" srcset="assets/title-motion.png">
          <img src="assets/title.png" alt="Tengen presents Tetris" width="192" height="176" draggable="false">
        </picture>
        <div class="menu" id="home-menu">
          <button class="action primary" id="continue-run" hidden>CONTINUE</button>
          <button class="action primary" id="play" disabled>PLAY</button>
          <button class="action" id="records">RECORDS</button>
        </div>
        <div class="menu" id="records-menu" hidden>
          <h1>RECORDS</h1>
          <p id="records-empty" hidden>NO RECORDS YET</p>
          <table id="records-table" hidden>
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col" id="records-name">NAME</th>
                <th scope="col" id="records-score">SCORE</th>
                <th scope="col" id="records-lines">LINES</th>
              </tr>
            </thead>
            <tbody id="record-rows"></tbody>
          </table>
          <button class="action primary" id="records-replay" hidden>PLAY AGAIN</button>
          <button class="action primary" id="records-back">BACK</button>
        </div>
        <div class="menu" id="record-edit-menu" hidden>
          <h1 id="record-edit-title" tabindex="-1">NEW RECORD</h1>
          <form id="record-form">
            <label for="record-input" id="record-label">NAME</label>
            <input id="record-input" type="text" dir="auto" placeholder="··········"
                   autocomplete="off" spellcheck="false" enterkeyhint="done" required>
            <button class="action primary" id="record-submit" disabled>SAVE RECORD</button>
          </form>
        </div>
        <div class="menu" id="record-confirm-menu" hidden>
          <h1 id="record-confirm-title">SAVE RECORD?</h1>
          <p id="record-confirm-name"><bdi></bdi></p>
          <div class="confirm-actions">
            <button class="action primary" id="record-confirm-yes">YES</button>
            <button class="action" id="record-confirm-no">NO</button>
          </div>
        </div>
        <div class="menu" id="confirm-menu" hidden>
          <h1 id="confirm-title"></h1>
          <div class="saved-preview">
            <img id="saved-thumbnail" alt="" hidden>
            <span id="saved-level"></span>
          </div>
          <p id="confirm-note" hidden></p>
          <div class="confirm-actions">
            <button class="action primary" id="confirm-yes">YES</button>
            <button class="action" id="confirm-no">NO</button>
          </div>
        </div>
        <div class="menu" id="setup-menu" hidden>
          <h1>NEW GAME</h1>
          <div class="choices" id="setup-choices"></div>
          <button class="action primary" id="start" disabled>START</button>
          <button class="action" id="setup-back">BACK</button>
        </div>
        <div class="menu" id="pause-menu" hidden>
          <h1>PAUSE</h1>
          <button class="action primary" id="resume">RESUME</button>
          <button class="action" id="sound">SOUND</button>
          <button class="action" id="restart">RESTART</button>
          <button class="action" id="main-menu">MAIN MENU</button>
        </div>
        <div class="menu" id="audio-menu" hidden>
          <h1>SOUND</h1>
          <div class="choices" id="audio-choices"></div>
          <button class="action primary" id="audio-back">BACK</button>
        </div>
        <p id="notice" role="status" hidden></p>
      </div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
